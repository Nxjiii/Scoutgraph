[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scoutgraph"
version = "0.1.0"
description = "Football intelligence backend for tactical profiles and stylistic similarity."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=0.10",
    "fastapi>=0.111",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.6",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
scoutgraph = "scoutgraph.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
